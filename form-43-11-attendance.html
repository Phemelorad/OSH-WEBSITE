<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f6fa; margin: 0; padding: 0; }
.page-container { padding: 20px; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 16px; }
.form-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 32px; margin-bottom: 20px; }
.form-header { text-align: center; margin-bottom: 28px; padding-bottom: 20px; border-bottom: 2px solid #2c3e50; }
.form-header .gov-logo { display: flex; justify-content: center; margin-bottom: 10px; }
        .form-header .gov-logo img { width: 70px; height: 54px; object-fit: contain; display: block; }
.form-header h1 { font-size: 20px; color: #2c3e50; margin: 8px 0 4px; text-transform: uppercase; letter-spacing: 1px; }
.form-header h2 { font-size: 14px; color: #7f8c8d; margin: 4px 0; font-weight: normal; }
.form-header .form-no { font-size: 13px; color: #e74c3c; font-weight: bold; margin-top: 8px; }
.form-header .act-ref { font-size: 12px; color: #555; margin-top: 4px; }
.section-title { font-size: 15px; font-weight: 700; color: #2c3e50; margin: 24px 0 16px; padding-bottom: 6px; border-bottom: 1px solid #ddd; }
.section-title:first-of-type { margin-top: 0; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 14px; }
.form-row-3 { grid-template-columns: 1fr 1fr 1fr; }
.form-row-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
.form-group { display: flex; flex-direction: column; }
.form-group.full { grid-column: 1 / -1; }
.form-group label { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 4px; }
.form-group input, .form-group select, .form-group textarea { padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; transition: border-color 0.2s; font-family: inherit; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #2c3e50; box-shadow: 0 0 0 3px rgba(44,62,80,0.1); }
.form-group textarea { min-height: 60px; resize: vertical; }
.wages-table { width: 100%; border-collapse: collapse; margin: 12px 0; }
.wages-table th { background: #2c3e50; color: #fff; font-size: 12px; padding: 8px 10px; text-align: left; }
.wages-table td { padding: 6px 10px; border-bottom: 1px solid #eee; }
.wages-table input { width: 100%; border: none; border-bottom: 1px dotted #999; padding: 4px 0; font-size: 13px; background: transparent; }
.wages-table input:focus { border-bottom-color: #2c3e50; outline: none; }
.btn-row { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee; }
.btn { padding: 10px 28px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: #2c3e50; color: #fff; }
.btn-primary:hover { background: #34495e; transform: translateY(-1px); }
.btn-secondary { background: #ecf0f1; color: #2c3e50; }
.btn-secondary:hover { background: #dfe6e9; }
.radio-group { display: flex; gap: 20px; align-items: center; padding: 6px 0; }
.radio-group label { font-weight: normal; font-size: 13px; cursor: pointer; }
.radio-group input[type="radio"] { margin-right: 4px; }
@media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } .form-row-3, .form-row-4 { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="navbar">
    <h1>BL Form 43/11 - Notification Medical Attendance</h1>
    <div class="user-info">
        <div class="user-details">
            <div class="user-name" id="userName">Loading...</div>
            <div class="user-department" id="userDepartment"></div>
        </div>
        <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>
</div>
<div class="page-container">
<div class="container">
<div class="form-card">
<div class="form-header">
<div class="gov-logo"><img src="Code-of-Arms-colour.png" alt="Republic of Botswana Coat of Arms"></div>
<h1>BL FORM 43/11</h1>
<h2>Notification of Time and Place of Attendance Upon Medical Practitioner</h2>
<div class="form-no">Worker's Compensation Act (Act No. 23 of 1998)</div>
</div>

<form id="attendanceForm">
<h3 class="section-title">1. Worker Details</h3>
<div id="bl-lookup-container"></div>
<div class="form-row">
<div class="form-group"><label>Omang / Passport No. <span style="color:#e74c3c">*</span></label><input type="text" id="worker_id_number" name="worker_id_number" placeholder="Search above or enter manually" required style="text-transform:uppercase"></div>
<div class="form-group"><label>Full Name of Worker <span style="color:#e74c3c">*</span></label><input type="text" id="worker_name" name="worker_name" placeholder="Full name" required></div>
</div>
<div class="form-row">
<div class="form-group full"><label>Full Address of Worker</label><textarea id="worker_address" name="worker_address" rows="2" placeholder="Full address"></textarea></div>
</div>

<h3 class="section-title">2. Notice Details</h3>
<div class="form-row">
<div class="form-group"><label>Date of Notice</label><input type="date" name="date_of_notice"></div>
</div>

<h3 class="section-title">3. Medical Examination Details</h3>
<div class="form-row">
<div class="form-group full"><label>Name of Medical Practitioner</label><input type="text" name="practitioner_name" placeholder="Full name of medical practitioner" required></div>
</div>
<div class="form-row">
<div class="form-group"><label>Place of Examination</label><input type="text" name="place_of_examination" placeholder="Venue/location"></div>
<div class="form-group"><label>Date of Examination</label><input type="date" name="date_of_examination"></div>
</div>
<div class="form-row">
<div class="form-group"><label>Time of Examination</label><input type="time" name="time_of_examination"></div>
</div>

<h3 class="section-title">4. Employer / Issuer Details</h3>
<div class="form-row form-row-3">
<div class="form-group"><label>Date of Notification</label><input type="date" name="notification_date"></div>
<div class="form-group"><label>Signature</label><input type="text" name="signature" placeholder="Signature"></div>
<div class="form-group"><label>Name of Signatory</label><input type="text" name="signatory_name" placeholder="Full name"></div>
</div>

<div class="btn-row">
<button type="button" class="btn btn-secondary" onclick="window.print()">Print</button>
<button type="submit" class="btn btn-primary">Submit</button>
</div>
</form>
</div>
</div>

<script src="supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="constants.js"></script>
<script src="role-permissions.js"></script>
<script src="modal.js"></script>
<script src="common.js"></script>
<script src="header.js"></script>
<script src="bl-lookup.js"></script>
    
<script src="nav.js"></script>
<script>window.OSH_ACTIVE_PAGE = 'bl-form-43-11';</script>
<script>
window.addEventListener('load', async function() {
    let authenticated = false;
    for (let i = 0; i < 5; i++) {
        authenticated = await isAuthenticated();
        if (authenticated) break;
        if (i < 4) await new Promise(r => setTimeout(r, 400));
    }
    if (!authenticated) { window.location.href = 'index.html'; return; }
    await initializeRoleSystem();
    const userResult = await getCurrentUser();
    if (!userResult.success || !userResult.user) return;
    const profileResult = await getUserProfile(userResult.user.id);
    const profile = profileResult.success ? profileResult.data : null;
    if (profile) {
        setUserNameSafely(profile.first_name + ' ' + profile.surname);
        var deptEl = document.getElementById('userDepartment');
        if (deptEl) deptEl.textContent = (typeof getRoleDisplayName === 'function' ? getRoleDisplayName(profile.role) : profile.role) || 'Department of Occupational Health & Safety';
    } else {
        setUserNameSafely(userResult.user.email.split('@')[0]);
    }

    // ── Check for pre-fill params from clientele ─────────────
    var params = new URLSearchParams(window.location.search);
    var prefillWorkerName    = params.get('worker_name')    || '';
    var prefillWorkerId      = params.get('worker_id')      || '';
    var prefillWorkerAddress = params.get('worker_address') || '';
    var prefillPractitioner  = params.get('practitioner')   || '';
    var prefillNoticeDate    = params.get('date_of_notice') || '';

    // Auto-fill practitioner name from logged-in profile if not in URL
    if (!prefillPractitioner && profile) {
        prefillPractitioner = (profile.first_name + ' ' + profile.surname).trim();
    }

    var hasPrefill = prefillWorkerName || prefillWorkerId;

    if (hasPrefill) {
        // Fill worker fields immediately — no lookup needed
        function setField(nameAttr, value) {
            if (!value) return;
            var el = document.getElementById(nameAttr) || document.querySelector('[name="' + nameAttr + '"]');
            if (!el) return;
            el.value = value;
            el.style.transition = 'background 0.3s';
            el.style.background = '#d4edda';
            setTimeout(function() { el.style.background = ''; }, 2500);
        }

        setField('worker_id_number',  prefillWorkerId);
        setField('worker_name',       prefillWorkerName);
        setField('worker_address',    prefillWorkerAddress);
        setField('practitioner_name', prefillPractitioner);
        setField('date_of_notice',    prefillNoticeDate);

        // Show a banner so the user knows fields were auto-filled
        var banner = document.createElement('div');
        banner.style.cssText = 'background:#d4edda;border:1px solid #c3e6cb;border-radius:8px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#155724;display:flex;align-items:center;gap:10px;';
        banner.innerHTML = '<span style="font-size:18px">✅</span><div><strong>Fields auto-filled from your clientele.</strong><br>Review the details below and fill in the appointment time before submitting.</div>';
        var formCard = document.querySelector('.form-card');
        var formEl2 = document.getElementById('attendanceForm');
        if (formCard && formEl2) formCard.insertBefore(banner, formEl2);

        // Hide the lookup panel — worker is already identified
        var lookupContainer = document.getElementById('bl-lookup-container');
        if (lookupContainer) lookupContainer.style.display = 'none';
    } else {
        // No pre-fill — initialise the normal BLLookup search panel
        BLLookup.init({
            workerFields: {
                id_number: 'worker_id_number',
                full_name: 'worker_name',
                address:   'worker_address',
            }
        });

        // Auto-fill practitioner name from profile (always useful)
        if (prefillPractitioner) {
            var pEl = document.querySelector('[name="practitioner_name"]');
            if (pEl) {
                pEl.value = prefillPractitioner;
                pEl.style.transition = 'background 0.3s';
                pEl.style.background = '#d4edda';
                setTimeout(function() { pEl.style.background = ''; }, 2500);
            }
        }
    }

var formEl = document.getElementById('attendanceForm');
if (formEl) {
    formEl.addEventListener('submit', async function(e) {
        e.preventDefault();
        var btn = formEl.querySelector('button[type="submit"]');
        btn.textContent = 'Submitting...';
        btn.disabled = true;

        try {
            var payload = {};
            var inputs = formEl.querySelectorAll('[name]');
            inputs.forEach(function(inp) {
                var val = inp.type === 'checkbox' ? inp.checked : inp.value;
                if (inp.type === 'number' && val) val = parseFloat(val);
                if (val !== '') payload[inp.name] = val;
            });

            var user = await getCurrentUser();
            if (!user.success || !user.user) { await showAlert('You must be logged in.', {type:'warning'}); btn.textContent = 'Submit'; btn.disabled = false; return; }
            payload.submitted_by = user.user.id;

            var result = await supabaseClient
                .from('medical_attendance_notifications')
                .insert([payload])
                .select();

            if (result.error) throw result.error;
            showToast('Form submitted successfully!', 'success');
            formEl.reset();

            // Re-apply practitioner name after reset since it comes from profile
            if (prefillPractitioner) {
                var pEl2 = document.querySelector('[name="practitioner_name"]');
                if (pEl2) pEl2.value = prefillPractitioner;
            }
        } catch(err) {
            await showAlert(err.message, {type:'error', title:'Submission Failed'});
            console.error('Form submit error:', err);
        } finally {
            btn.textContent = 'Submit';
            btn.disabled = false;
        }
    });
}
});
</script></body>
</html>
